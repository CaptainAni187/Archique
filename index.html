<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archique</title>
    <meta
      name="description"
      content="Original artwork by an independent studio. Every piece is one of one — see it on your own wall at true size before you buy."
    />
    <meta property="og:title" content="Archique — Original Artwork" />
    <meta
      property="og:description"
      content="Original artwork by an independent studio. Every piece is one of one."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.archique.in/" />
    <meta property="og:site_name" content="Archique" />
    <!-- Absolute URL is required: relative paths are not resolved by the
         crawlers that build link previews. -->
    <meta property="og:image" content="https://www.archique.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Archique — original artwork" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Archique — Original Artwork" />
    <meta
      name="twitter:description"
      content="Original artwork by an independent studio. Every piece is one of one."
    />
    <meta name="twitter:image" content="https://www.archique.in/og-image.png" />
    <script>
      // Dark is the default. Applied before paint so there is no light flash.
      (function () {
        try {
          if (localStorage.getItem('archique-theme') !== 'light') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
